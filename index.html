<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <title>PixiJS - Template</title>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <!-- Google Ad Placement API (H5 Games Ads). Loaded unconditionally, same as the
         Poki/CrazyGames tags above — it only does anything when VITE_AD_SDK=google. -->
    <script async
        data-ad-frequency-hint="30s"
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-%VITE_GOOGLE_AD_CLIENT%"
        crossorigin="anonymous"></script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        window.adBreak = window.adConfig = function (o) { window.adsbygoogle.push(o); };
    </script>
</head>

<body>
    <div id="app">
        <div id="pixi-container"></div>
        <div class="rotate-overlay" aria-hidden="true">
            <p class="rotate-overlay__title">ROTATE YOUR DEVICE</p>
            <p class="rotate-overlay__subtitle">Turn your phone to landscape to play</p>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
